# DMS Collect 前端 Nginx 配置模板（部署在 39.185.83.71 上，使用 HTTP 访问以避免 MinIO Mixed Content）
# 使用方式（在 39 服务器上）：
#   sudo cp deploy/nginx.dms-collect.conf /etc/nginx/conf.d/dms-collect.conf
#   sudo nginx -t && sudo nginx -s reload

server {
    listen 8080; # 如 80 端口空闲也可改为 80
    server_name _;

    root /var/www/dms_collect/dist;
    index index.html;

    client_max_body_size 100m;

    # 入口 HTML 禁用缓存，确保发版后浏览器立即拿到最新资源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API（本机 8001）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 反向代理 WebSocket（如使用）
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
